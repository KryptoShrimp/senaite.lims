<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure SSO Direct Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .code { background: #e0e0e0; padding: 5px; font-family: monospace; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        #log { background: black; color: white; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Azure SSO Direct Test</h1>
    
    <div class="section">
        <h2>Step 1: Verify Supabase Connection</h2>
        <button onclick="testSupabaseConnection()">Test Connection</button>
        <div id="connection-result"></div>
    </div>

    <div class="section">
        <h2>Step 2: Manual Azure Login URL</h2>
        <p>Click this button to generate the direct Azure login URL:</p>
        <button onclick="generateAzureUrl()">Generate Azure Login URL</button>
        <div id="azure-url"></div>
    </div>

    <div class="section">
        <h2>Step 3: Test OAuth Flow</h2>
        <button onclick="testOAuthFlow()">Test OAuth Login</button>
    </div>

    <div class="section">
        <h2>Console Log</h2>
        <div id="log"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Direct configuration
        const SUPABASE_URL = 'https://hlegzvytcoqdvoqqqmaa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWd6dnl0Y29xZHZvcXFxbWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI2ODU4NDIsImV4cCI6MjA2ODI2MTg0Mn0.DEgfEuTfrnmqEb9rfu0GXEqXSyypKaBiPC-QwJRI5kI';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toISOString();
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'white';
            logDiv.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        async function testSupabaseConnection() {
            log('Testing Supabase connection...');
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) {
                    log(`Connection error: ${error.message}`, 'error');
                } else {
                    log('Supabase connection successful!', 'success');
                    log(`Session: ${data.session ? 'Active' : 'None'}`);
                }
                document.getElementById('connection-result').innerHTML = 
                    error ? `<span class="error">Error: ${error.message}</span>` : 
                    '<span class="success">Connected successfully!</span>';
            } catch (err) {
                log(`Exception: ${err.message}`, 'error');
                document.getElementById('connection-result').innerHTML = 
                    `<span class="error">Exception: ${err.message}</span>`;
            }
        }

        function generateAzureUrl() {
            const redirectUrl = window.location.origin + '/frontend/auth-callback.html';
            log(`Using redirect URL: ${redirectUrl}`);
            
            // Direct Azure OAuth URL construction
            const azureAuthUrl = `${SUPABASE_URL}/auth/v1/authorize?provider=azure&redirect_to=${encodeURIComponent(redirectUrl)}&scopes=email`;
            
            document.getElementById('azure-url').innerHTML = `
                <p>Direct Azure Auth URL:</p>
                <div class="code" style="word-break: break-all;">${azureAuthUrl}</div>
                <p><a href="${azureAuthUrl}" target="_blank">Click here to test login in new tab</a></p>
                <p>If this works, copy the error message or success response.</p>
            `;
            
            log(`Generated Azure Auth URL: ${azureAuthUrl}`);
        }

        async function testOAuthFlow() {
            log('Starting OAuth flow test...');
            try {
                const redirectUrl = window.location.origin + '/frontend/auth-callback.html';
                log(`Redirect URL: ${redirectUrl}`);
                
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'azure',
                    options: {
                        redirectTo: redirectUrl,
                        scopes: 'email',
                        queryParams: {
                            prompt: 'select_account'
                        }
                    }
                });
                
                if (error) {
                    log(`OAuth error: ${error.message}`, 'error');
                    log(`Full error object: ${JSON.stringify(error)}`, 'error');
                } else {
                    log('OAuth initiated successfully', 'success');
                    log(`Provider: ${data.provider}`);
                    log(`URL: ${data.url}`);
                }
            } catch (err) {
                log(`Exception during OAuth: ${err.message}`, 'error');
                log(`Stack trace: ${err.stack}`, 'error');
            }
        }

        // Check URL parameters on load
        window.addEventListener('load', () => {
            log('Page loaded');
            
            const params = new URLSearchParams(window.location.search);
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            
            // Check for errors
            const error = params.get('error') || hashParams.get('error');
            const errorDesc = params.get('error_description') || hashParams.get('error_description');
            
            if (error) {
                log(`URL contains error: ${error}`, 'error');
                if (errorDesc) {
                    log(`Error description: ${errorDesc}`, 'error');
                }
            }
            
            // Check for code
            const code = params.get('code') || hashParams.get('code');
            if (code) {
                log(`Authorization code found: ${code.substring(0, 20)}...`, 'success');
            }
            
            // Listen for auth changes
            supabase.auth.onAuthStateChange((event, session) => {
                log(`Auth event: ${event}`);
                if (session) {
                    log(`User: ${session.user.email}`, 'success');
                }
            });
        });
    </script>
</body>
</html>
