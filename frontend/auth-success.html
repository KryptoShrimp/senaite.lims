<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAITE LIMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .header {
            background-color: #0078d4;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
        
        .app-frame {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>SENAITE LIMS</h3>
        <div>
            <span id="userEmail">Loading...</span>
            <a href="#" class="logout-btn" onclick="logout()">Logout</a>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <h2>Loading SENAITE...</h2>
        <p>Please wait while we set up your session.</p>
    </div>
    
    <iframe id="appFrame" class="app-frame" src="http://localhost:8080" style="display: none;"></iframe>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Supabase configuration
        const SUPABASE_URL = 'https://hlegzvytcoqdvoqqqmaa.supabase.co'
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsZWd6dnl0Y29xZHZvcXFxbWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI2ODU4NDIsImV4cCI6MjA2ODI2MTg0Mn0.DEgfEuTfrnmqEb9rfu0GXEqXSyypKaBiPC-QwJRI5kI'
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        
        // Create or update user in senaite_users table
        async function createOrUpdateUser(user) {
            try {
                const userData = {
                    auth_user_id: user.id,
                    email: user.email,
                    full_name: user.user_metadata?.full_name || user.email,
                    azure_id: user.user_metadata?.sub || user.user_metadata?.provider_id,
                    department: user.user_metadata?.department || null,
                    role: 'user',
                    is_active: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }

                const { data, error } = await supabase
                    .from('senaite_users')
                    .upsert(userData, { 
                        onConflict: 'auth_user_id',
                        ignoreDuplicates: false 
                    })
                    .select()

                if (error) {
                    console.error('Error creating/updating user:', error)
                    return null
                }

                console.log('User created/updated:', data)
                return data[0]
            } catch (err) {
                console.error('Error in createOrUpdateUser:', err)
                return null
            }
        }
        
        // Initialize app
        async function initApp() {
            try {
                // Get current user
                const { data: { user }, error } = await supabase.auth.getUser()
                
                if (error) {
                    console.error('Error getting user:', error)
                    window.location.href = 'simple-auth.html'
                    return
                }
                
                if (!user) {
                    console.log('No user found, redirecting to login')
                    window.location.href = 'simple-auth.html'
                    return
                }
                
                // Update UI
                document.getElementById('userEmail').textContent = user.email
                
                // Create/update user in database
                const dbUser = await createOrUpdateUser(user)
                if (dbUser) {
                    console.log('User synchronized to database:', dbUser)
                }
                
                // Show SENAITE app
                document.getElementById('loading').style.display = 'none'
                document.getElementById('appFrame').style.display = 'block'
                
            } catch (err) {
                console.error('Error initializing app:', err)
                window.location.href = 'simple-auth.html'
            }
        }
        
        // Logout function
        async function logout() {
            try {
                const { error } = await supabase.auth.signOut()
                if (error) console.error('Logout error:', error)
                window.location.href = 'simple-auth.html'
            } catch (err) {
                console.error('Logout error:', err)
                window.location.href = 'simple-auth.html'
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initApp)
    </script>
</body>
</html>
