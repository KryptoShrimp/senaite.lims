<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAITE LIMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        .header {
            background-color: #0078d4;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }
        
        .logout-btn:hover {
            background-color: #c82333;
        }
        
        .app-frame {
            width: 100%;
            height: calc(100vh - 50px);
            border: none;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .error {
            text-align: center;
            padding: 2rem;
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            margin: 1rem;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h3>SENAITE LIMS</h3>
        <div>
            <span id="userEmail">Loading...</span>
            <a href="#" class="logout-btn" onclick="logout()">Logout</a>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <h2>Loading SENAITE...</h2>
        <p>Please wait while we set up your session.</p>
    </div>
    
    <div class="error" id="error" style="display: none;">
        <h2>Error</h2>
        <p id="errorMessage">An error occurred. Please try again.</p>
        <button onclick="retry()">Retry</button>
    </div>
    
    <iframe id="appFrame" class="app-frame" src="about:blank" style="display: none;"></iframe>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // Get configuration from centralized config
        const CONFIG = window.SENAITE_CONFIG || {};
        
        // Initialize Supabase client with centralized config
        const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        
        // DOM elements
        const loadingElement = document.getElementById('loading');
        const errorElement = document.getElementById('error');
        const errorMessageElement = document.getElementById('errorMessage');
        const appFrameElement = document.getElementById('appFrame');
        const userEmailElement = document.getElementById('userEmail');
        
        // Show error message
        function showError(message) {
            errorMessageElement.textContent = message;
            loadingElement.style.display = 'none';
            errorElement.style.display = 'block';
            appFrameElement.style.display = 'none';
        }
        
        // Retry function
        function retry() {
            errorElement.style.display = 'none';
            loadingElement.style.display = 'block';
            initApp();
        }
        
        // Create or update user in senaite_users table
        async function createOrUpdateUser(user) {
            try {
                const userData = {
                    auth_user_id: user.id,
                    email: user.email,
                    full_name: user.user_metadata?.full_name || user.user_metadata?.name || user.email,
                    azure_id: user.user_metadata?.sub || user.user_metadata?.provider_id,
                    department: user.user_metadata?.department || null,
                    role: 'user',
                    is_active: true,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }

                console.log('Creating/updating user with data:', userData);

                const { data, error } = await supabase
                    .from('senaite_users')
                    .upsert(userData, { 
                        onConflict: 'auth_user_id',
                        ignoreDuplicates: false 
                    })
                    .select()

                if (error) {
                    console.error('Error creating/updating user:', error);
                    return null;
                }

                console.log('User created/updated:', data);
                return data[0];
            } catch (err) {
                console.error('Error in createOrUpdateUser:', err);
                return null;
            }
        }
        
        // Initialize app
        async function initApp() {
            try {
                console.log('Initializing app with config:', CONFIG);
                
                // Verify configuration
                if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
                    showError('Configuration error: Missing Supabase credentials');
                    return;
                }
                
                if (!CONFIG.SENAITE_URL) {
                    showError('Configuration error: Missing SENAITE URL');
                    return;
                }
                
                // Get current user
                const { data: { user }, error } = await supabase.auth.getUser();
                
                if (error) {
                    console.error('Error getting user:', error);
                    showError(`Authentication error: ${error.message}`);
                    return;
                }
                
                if (!user) {
                    console.log('No user found, redirecting to login');
                    window.location.href = CONFIG.LOGIN_URL || '/frontend/index.html';
                    return;
                }
                
                // Update UI with user email
                userEmailElement.textContent = user.email;
                
                // Create/update user in database
                const dbUser = await createOrUpdateUser(user);
                if (dbUser) {
                    console.log('User synchronized to database:', dbUser);
                } else {
                    console.warn('Failed to sync user to database');
                }
                
                // Show SENAITE app
                loadingElement.style.display = 'none';
                appFrameElement.style.display = 'block';
                appFrameElement.src = CONFIG.SENAITE_URL;
                
            } catch (err) {
                console.error('Error initializing app:', err);
                showError(`Initialization error: ${err.message}`);
            }
        }
        
        // Logout function
        async function logout() {
            try {
                const { error } = await supabase.auth.signOut();
                if (error) {
                    console.error('Logout error:', error);
                    showError(`Logout error: ${error.message}`);
                } else {
                    window.location.href = CONFIG.LOGIN_URL || '/frontend/index.html';
                }
            } catch (err) {
                console.error('Logout error:', err);
                showError(`Logout error: ${err.message}`);
            }
        }
        
        // Listen for auth state changes
        supabase.auth.onAuthStateChange(async (event, session) => {
            console.log('Auth state changed:', event, session?.user?.email);
            
            if (event === 'SIGNED_OUT') {
                window.location.href = CONFIG.LOGIN_URL || '/frontend/index.html';
            } else if (event === 'TOKEN_REFRESHED') {
                console.log('Token refreshed');
            }
        });
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
