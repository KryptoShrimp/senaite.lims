version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: senaite-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-data:/var/www/certbot:ro
      - certbot-ssl:/etc/letsencrypt:ro
    depends_on:
      - senaite
    restart: unless-stopped
    networks:
      - senaite-network

  certbot:
    image: certbot/certbot
    container_name: senaite-certbot
    volumes:
      - certbot-data:/var/www/certbot
      - certbot-ssl:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - senaite-network

  senaite:
    build:
      context: ./senaite-custom
      dockerfile: Dockerfile
    container_name: senaite
    environment:
      - SITE=senaite
      - ZEO_ADDRESS=zeo:8080
      - RELSTORAGE_DSN=postgresql://senaite:${SUPABASE_PASSWORD}@${SUPABASE_HOST}:5432/${SUPABASE_DB}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
    volumes:
      - senaite-data:/data
      - ./buildout-custom.cfg:/home/senaite/senaitelims/buildout.cfg:ro
    depends_on:
      - zeo
    restart: unless-stopped
    networks:
      - senaite-network

  zeo:
    build:
      context: ./senaite-custom
      dockerfile: Dockerfile
    container_name: senaite-zeo
    command: zeo
    environment:
      - RELSTORAGE_DSN=postgresql://senaite:${SUPABASE_PASSWORD}@${SUPABASE_HOST}:5432/${SUPABASE_DB}
    volumes:
      - zeo-data:/data
    restart: unless-stopped
    networks:
      - senaite-network

volumes:
  senaite-data:
    driver: local
  zeo-data:
    driver: local
  certbot-data:
    driver: local
  certbot-ssl:
    driver: local

networks:
  senaite-network:
    driver: bridge